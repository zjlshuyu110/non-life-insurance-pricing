[project]
name = "non-life-insurance-pricing"
version = "0.1.0"
description = "Reproducible French motor insurance pricing: frequency-severity and Tweedie GLMs."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = [
  "numpy>=2.2,<3", "pandas>=2.2,<3", "scikit-learn>=1.7,<1.8",
  "matplotlib>=3.10,<4", "plotly>=6,<7", "liac-arff>=2.5,<3", "rdata>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
